name: Verify application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Check backend
        working-directory: backend
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir /tmp/zombie-tag-worker
      - name: Check host diagnostic wire format
        run: sh firmware/tests/run_gateway_diagnostics.sh
      - name: Check badge announcement wire format
        run: sh firmware/tests/run-announcement-tests.sh
      - name: Check badge channel discovery
        run: sh firmware/tests/run-channel-tests.sh
      - name: Check authenticated mesh discovery
        run: sh firmware/tests/run-mesh-discovery-tests.sh
